<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess the Number</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e8e8f0;
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #18181f;
      border: 1px solid #2a2a38;
      border-radius: 20px;
      padding: 2.25rem 2rem;
    }

    .header { margin-bottom: 1.75rem; }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7c6fff;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      color: #f0f0f8;
      line-height: 1.2;
    }

    h1 span {
      color: #7c6fff;
    }

    .tagline {
      font-size: 14px;
      color: #6b6b80;
      margin-top: 6px;
      line-height: 1.5;
    }

    /* Difficulty */
    .diff-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.75rem;
    }

    .diff-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid #2a2a38;
      border-radius: 10px;
      background: #0f0f13;
      color: #6b6b80;
      cursor: pointer;
      transition: all 0.15s;
    }

    .diff-btn:hover { border-color: #4a4a60; color: #b0b0c8; }

    .diff-btn.active {
      border-color: #7c6fff;
      background: #1e1b2e;
      color: #a99dff;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.75rem;
    }

    .stat {
      background: #0f0f13;
      border: 1px solid #2a2a38;
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: #6b6b80;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 600;
      color: #f0f0f8;
      font-variant-numeric: tabular-nums;
    }

    /* Range bar */
    .range-bar {
      background: #0f0f13;
      border: 1px solid #2a2a38;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 13px;
    }

    .range-label { color: #6b6b80; }
    .range-vals { color: #a99dff; font-weight: 500; }

    /* Input */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
    }

    input[type="number"] {
      flex: 1;
      height: 48px;
      padding: 0 16px;
      font-size: 16px;
      background: #0f0f13;
      border: 1px solid #2a2a38;
      border-radius: 12px;
      color: #f0f0f8;
      outline: none;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

    input[type="number"]:focus { border-color: #7c6fff; }
    input[type="number"]:disabled { opacity: 0.4; cursor: not-allowed; }

    .guess-btn {
      height: 48px;
      padding: 0 22px;
      font-size: 15px;
      font-weight: 600;
      background: #7c6fff;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .guess-btn:hover { background: #9488ff; }
    .guess-btn:active { transform: scale(0.97); }
    .guess-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* Hint box */
    .hint-box {
      border-radius: 12px;
      padding: 16px;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      transition: background 0.2s, color 0.2s;
      line-height: 1.4;
    }

    .hint-default { background: #0f0f13; color: #6b6b80; border: 1px solid #2a2a38; }
    .hint-low     { background: #1e1608; color: #d4a829; border: 1px solid #3a2d10; }
    .hint-high    { background: #0d1525; color: #5a9cf5; border: 1px solid #162240; }
    .hint-win     { background: #0a1f14; color: #40c878; border: 1px solid #143322; }
    .hint-lose    { background: #1f0d0d; color: #e05555; border: 1px solid #3a1212; }

    /* History */
    .history {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 28px;
      margin-bottom: 1.25rem;
    }

    .badge {
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid;
    }

    .badge-low  { background: #1e1608; color: #d4a829; border-color: #3a2d10; }
    .badge-high { background: #0d1525; color: #5a9cf5; border-color: #162240; }
    .badge-win  { background: #0a1f14; color: #40c878; border-color: #143322; }

    /* Reset */
    .reset-btn {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid #2a2a38;
      border-radius: 12px;
      background: transparent;
      color: #6b6b80;
      cursor: pointer;
      transition: all 0.15s;
    }

    .reset-btn:hover { border-color: #4a4a60; color: #b0b0c8; background: #0f0f13; }

    /* Win animation */
    @keyframes pop { 0%,100%{transform:scale(1)} 40%{transform:scale(1.04)} }
    .pop { animation: pop 0.4s ease; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <p class="eyebrow">Number Game</p>
    <h1>Guess the <span>secret</span> number</h1>
    <p class="tagline" id="tagline">I'm thinking of a number between 1 and 50. Can you find it?</p>
  </div>

  <div class="diff-row">
    <button class="diff-btn active" onclick="setDiff('easy')"   id="d-easy">Easy (1–50)</button>
    <button class="diff-btn"        onclick="setDiff('medium')" id="d-medium">Medium (1–100)</button>
    <button class="diff-btn"        onclick="setDiff('hard')"   id="d-hard">Hard (1–200)</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Attempts</div><div class="stat-value" id="attempts">0</div></div>
    <div class="stat"><div class="stat-label">Remaining</div><div class="stat-value" id="remaining">7</div></div>
    <div class="stat"><div class="stat-label">Wins</div><div class="stat-value" id="wins">0</div></div>
  </div>

  <div class="range-bar">
    <span class="range-label">Current range</span>
    <span class="range-vals" id="rangeVals">1 — 50</span>
  </div>

  <div class="input-row">
    <input type="number" id="guessInput" placeholder="Your guess…" min="1" max="50" />
    <button class="guess-btn" onclick="makeGuess()" id="guessBtn">Guess</button>
  </div>

  <div class="hint-box hint-default" id="hintBox">Enter a number and press Guess</div>

  <div class="history" id="history"></div>

  <button class="reset-btn" onclick="resetGame()">↺ &nbsp;New game</button>
</div>

<script>
  const DIFFS = {
    easy:   { max: 50,  attempts: 7  },
    medium: { max: 100, attempts: 8  },
    hard:   { max: 200, attempts: 10 }
  };

  let secret, attempts, maxAttempts, rangeMax, wins = 0, diff = 'easy', gameOver = false;

  function setDiff(d) {
    diff = d;
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('d-' + d).classList.add('active');
    resetGame();
  }

  function resetGame() {
    const cfg = DIFFS[diff];
    rangeMax    = cfg.max;
    maxAttempts = cfg.attempts;
    secret      = Math.floor(Math.random() * rangeMax) + 1;
    attempts    = 0;
    gameOver    = false;

    document.getElementById('attempts').textContent  = 0;
    document.getElementById('remaining').textContent = maxAttempts;
    document.getElementById('wins').textContent      = wins;
    document.getElementById('rangeVals').textContent = '1 — ' + rangeMax;
    document.getElementById('tagline').textContent   = "I'm thinking of a number between 1 and " + rangeMax + ". Can you find it?";
    setHint('default', 'Enter a number and press Guess');
    document.getElementById('history').innerHTML     = '';

    const inp = document.getElementById('guessInput');
    inp.value    = '';
    inp.max      = rangeMax;
    inp.disabled = false;
    document.getElementById('guessBtn').disabled = false;
    inp.focus();
  }

  function makeGuess() {
    if (gameOver) return;
    const inp = document.getElementById('guessInput');
    const val = parseInt(inp.value);

    if (!val || val < 1 || val > rangeMax) {
      setHint('lose', 'Please enter a number between 1 and ' + rangeMax + '.');
      return;
    }

    attempts++;
    const remaining = maxAttempts - attempts;
    document.getElementById('attempts').textContent  = attempts;
    document.getElementById('remaining').textContent = remaining;

    if (val === secret) {
      setHint('win', '🎉 Yes! ' + secret + ' is correct — you nailed it in ' + attempts + ' attempt' + (attempts > 1 ? 's' : '') + '!');
      addBadge(val, 'win');
      wins++;
      document.getElementById('wins').textContent = wins;
      document.getElementById('tagline').textContent = 'Nice work! Start a new game?';
      end();
    } else if (attempts >= maxAttempts) {
      setHint('lose', 'Out of guesses. The number was ' + secret + '. Better luck next time!');
      addBadge(val, val < secret ? 'low' : 'high');
      document.getElementById('tagline').textContent = 'Game over — try again!';
      end();
    } else if (val < secret) {
      setHint('low', '↑ Too low! Go higher. ' + remaining + ' guess' + (remaining !== 1 ? 'es' : '') + ' left.');
      addBadge(val, 'low');
    } else {
      setHint('high', '↓ Too high! Go lower. ' + remaining + ' guess' + (remaining !== 1 ? 'es' : '') + ' left.');
      addBadge(val, 'high');
    }

    inp.value = '';
    if (!gameOver) inp.focus();
  }

  function end() {
    gameOver = true;
    document.getElementById('guessInput').disabled = true;
    document.getElementById('guessBtn').disabled   = true;
  }

  function setHint(type, text) {
    const box = document.getElementById('hintBox');
    box.className = 'hint-box hint-' + type;
    box.textContent = text;
    box.classList.remove('pop');
    void box.offsetWidth;
    box.classList.add('pop');
  }

  function addBadge(val, type) {
    const arrow = { low: '↑', high: '↓', win: '✓' }[type] || '';
    const b = document.createElement('span');
    b.className = 'badge badge-' + type;
    b.textContent = val + ' ' + arrow;
    document.getElementById('history').appendChild(b);
  }

  document.getElementById('guessInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') makeGuess();
  });

  resetGame();
</script>
</body>
</html>
